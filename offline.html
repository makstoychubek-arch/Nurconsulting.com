<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1C1C1E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NR Space — нет соединения</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        :root {
            --bg: #1C1C1E;
            --surface: #2C2C2E;
            --text: #F5F5F7;
            --muted: #A0A0A0;
            --border: #3A3A3C;
            --accent: #0A84FF;
        }
        html[data-theme="ios"] {
            --bg: #F4F4F5;
            --surface: #FFFFFF;
            --text: #111111;
            --muted: #71717A;
            --border: #E0E0E0;
            --accent: #3B82F6;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; min-height: 100%;
            background: var(--bg); color: var(--text);
            font-family: Inter, system-ui, -apple-system, sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
        }
        body {
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        }
        .card {
            width: min(420px, 100%);
            background: var(--surface);
            border-radius: 22px;
            padding: 36px 28px 28px;
            text-align: center;
        }
        .logo {
            width: 64px; height: 64px; margin: 0 auto 20px;
            background: #fff; color: #111;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.12);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px; letter-spacing: -0.06em;
        }
        h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.03em; }
        p { margin: 0 0 24px; font-size: 15px; color: var(--muted); line-height: 1.45; }
        button {
            width: 100%; min-height: 44px; border: none; border-radius: 12px;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo" aria-hidden="true">NR</div>
        <h1>NR Space</h1>
        <p>Нет соединения, попробуйте позже</p>
        <button type="button" onclick="location.reload()">Повторить</button>
    </div>
    <script>
        (function () {
            var theme = 'neon';
            try { theme = localStorage.getItem('nr_theme') || 'neon'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme === 'ios' ? 'ios' : 'neon');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = theme === 'ios' ? '#F4F4F5' : '#1C1C1E';
        })();
    </script>
</body>
</html>
