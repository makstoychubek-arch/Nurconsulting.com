<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icons/favicon.png" sizes="32x32"><title>Страница не найдена — NR Space</title><meta name="robots" content="noindex"><style>
:root{--bg:#f5f4f0;--ink:#111;--dim:#5b5b60;--line:rgba(0,0,0,.12);--accent:#f97316}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e12;--ink:#f4f4f5;--dim:#a1a1aa;--line:rgba(255,255,255,.14)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:34px}.top img{width:30px;height:30px}
.pill{border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;text-decoration:none}
h1{font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:19px;margin:30px 0 6px}
p,li{color:var(--ink)}.dim{color:var(--dim);font-size:14px}ul{padding-left:22px}a{color:var(--accent)}
.big{font-size:84px;font-weight:800;letter-spacing:-.04em;margin:40px 0 0;color:var(--accent)}
.btn{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;text-decoration:none;padding:11px 20px;border-radius:12px;font-weight:600}
</style></head>
<body><div class="wrap"><div class="top"><img src="/icons/logo-nr.svg" alt="NR" width="30" height="30"><a class="pill" href="/">Space</a></div>
<div class="big">404</div>
<h1>Такой страницы нет</h1>
<p class="dim">Возможно, ссылка устарела или в адресе опечатка.</p>
<a class="btn" href="/">На главную</a> <a class="btn" style="background:transparent;color:var(--ink);border:1.5px solid var(--line)" href="/login">Войти в NR Space</a>
</div></body></html>
