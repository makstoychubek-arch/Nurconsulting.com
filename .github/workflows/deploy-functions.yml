name: Deploy Supabase functions

# Выкладка edge-функций в рабочий проект Supabase.
# Автоматически: при слиянии в main выкладываются функции, у которых изменилась своя папка.
# Вручную: Actions -> Deploy Supabase functions -> Run workflow, список имён через пробел (по умолчанию wb-proxy).
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Supabase: Account -> Access Tokens).
# Если менялась папка supabase/functions/_shared, запустите вручную с именами функций, которые её используют.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Имена функций через пробел'
        default: 'wb-proxy'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: fiukyfyhotctvfdidktx

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Проверка секрета
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Не задан секрет SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions)"; exit 1; fi
      - name: Список функций
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.functions }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            names="$INPUT"
          else
            names=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | awk -F/ '$3 != "_shared" && $3 != "" {print $3}' | sort -u | tr '\n' ' ')
          fi
          valid=""
          for n in $names; do
            if [ -f "supabase/functions/$n/index.ts" ]; then valid="$valid $n"; else echo "::warning::Функции $n нет, пропущена"; fi
          done
          echo "names=$valid" >> "$GITHUB_OUTPUT"
          echo "К выкладке:$valid"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Выкладка
        if: steps.list.outputs.names != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for n in ${{ steps.list.outputs.names }}; do
            echo "== $n"
            supabase functions deploy "$n" --project-ref "$PROJECT_REF" --use-api
          done
