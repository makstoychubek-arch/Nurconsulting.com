<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120" role="img" aria-label="Снежный барс">
<style>
.tail{transform-origin:92px 98px;animation:tail 2.4s ease-in-out infinite}
.head{transform-origin:70px 70px;animation:head 3.2s ease-in-out infinite}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 3.8s infinite}
.body{transform-origin:70px 100px;animation:breath 2.4s ease-in-out infinite}
.snow{animation:snow 3s linear infinite;opacity:0}
.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes head{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes snow{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tail,.head,.eye,.body,.snow{animation:none}.snow{opacity:.7}}
</style>
<g class="snow"><circle cx="20" cy="22" r="2.2" fill="#9FD4F5"/></g>
<g class="snow s2"><circle cx="118" cy="14" r="2" fill="#9FD4F5"/></g>
<g class="snow s3"><circle cx="30" cy="8" r="1.6" fill="#9FD4F5"/></g>
