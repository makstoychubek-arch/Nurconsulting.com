<g class="body"><path d="M44 112c-6-6-6-22 2-32 6-7 12-10 24-10s18 3 24 10c8 10 8 26 2 32z" fill="#F3F6F9" stroke="#8E9AA8" stroke-width="2" stroke-linejoin="round"/>
<rect x="52" y="92" width="14" height="20" rx="7" fill="#F3F6F9" stroke="#8E9AA8" stroke-width="2"/><rect x="74" y="92" width="14" height="20" rx="7" fill="#F3F6F9" stroke="#8E9AA8" stroke-width="2"/>
<g fill="none" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round"><circle cx="60" cy="86" r="3.4"/><circle cx="82" cy="90" r="3.4"/><circle cx="48" cy="100" r="2.6"/><circle cx="94" cy="102" r="2.6"/></g>
<path d="M54 76c8 7 24 7 32 0l-3 9c-8 5-18 5-26 0z" fill="#F97316" stroke="#C2410C" stroke-width="1.6" stroke-linejoin="round"/></g>
<g class="head"><path d="M47 44l-4-22 20 10zM93 44l4-22-20 10z" fill="#EEF2F6" stroke="#8E9AA8" stroke-width="2" stroke-linejoin="round"/><path d="M49 38l-2-11 10 6zM91 38l2-11-10 6z" fill="#F2B6C2"/>
<ellipse cx="70" cy="54" rx="29" ry="25" fill="#F7F9FB" stroke="#8E9AA8" stroke-width="2"/>
<g fill="#4B5563"><circle cx="63" cy="36" r="1.6"/><circle cx="70" cy="33.5" r="1.6"/><circle cx="77" cy="36" r="1.6"/><circle cx="46" cy="55" r="1.4"/><circle cx="94" cy="55" r="1.4"/></g>
<path d="M44 60l-7 1M44 65l-6 4M96 60l7 1M96 65l6 4" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round"/>
<g class="eye"><ellipse cx="58" cy="51" rx="5.6" ry="6" fill="#B8E2F8" stroke="#6B7C8C" stroke-width="1.4"/><ellipse cx="58" cy="52" rx="2.4" ry="3.6" fill="#1F2933"/><circle cx="59.4" cy="49.6" r="1.2" fill="#fff"/></g>
<g class="eye"><ellipse cx="82" cy="51" rx="5.6" ry="6" fill="#B8E2F8" stroke="#6B7C8C" stroke-width="1.4"/><ellipse cx="82" cy="52" rx="2.4" ry="3.6" fill="#1F2933"/><circle cx="83.4" cy="49.6" r="1.2" fill="#fff"/></g>
<path d="M65 61h10l-5 5z" fill="#F2A3B3" stroke="#B45A6E" stroke-width="1.2" stroke-linejoin="round"/><path d="M70 66v3m0 0c-3 3-7 3-9 0m9 0c3 3 7 3 9 0" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round"/>
</g></svg>
