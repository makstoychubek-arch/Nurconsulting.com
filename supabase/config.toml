# Telegram webhook не шлёт user JWT — роутер принимает секрет бота сам.
[functions.telegram-router]
verify_jwt = false

# Facebook редиректит на callback без JWT пользователя.
[functions.content-ig-oauth]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

# Вебхук бота Акылай: Telegram не шлёт JWT, функция сверяет AKYLAI_WEBHOOK_SECRET.
[functions.akylai-bot]
verify_jwt = false

# Проверка раз в 15 минут вызывается планировщиком без ключа и пишет только владельцу в Telegram.
[functions.admin-alerts]
verify_jwt = false

# MCP для личного ИИ клиента: вход по личному ключу в адресе, не по сессии сайта. Только чтение своих кабинетов.
[functions.mcp]
verify_jwt = false
