<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NR Space — Новый пароль</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/dist/tailwind.0d721d80c7.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/nr-vibe.css">
    <script src="/nr-auth.js"></script>
    <style>
        body { font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .input-field { background: var(--paper-2); border: 1px solid var(--line); color: var(--ink); }
        .input-field:focus { outline: none; background: var(--card); border-color: var(--ink); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="w-full max-w-md">
        <h1 class="text-2xl tracking-tight text-center mb-2" style="font-family: var(--font-display, inherit); font-weight: 800">Новый пароль</h1>
        <p class="text-sm text-center mb-6" style="color:var(--ink-dim)">Придумайте пароль для входа в NR Space</p>
        <div class="p-8" style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius)">
            <div id="state-wait" class="text-sm text-center" style="color:var(--ink-dim)">Проверяем ссылку…</div>
            <div id="state-bad" class="hidden text-sm text-center">
                <p class="mb-4">Ссылка недействительна или устарела. Запросите новое письмо.</p>
                <a href="/login" class="vibe-btn w-full" style="display:block;text-align:center">Вернуться ко входу</a>
            </div>
            <div id="state-form" class="hidden space-y-3">
                <input type="password" id="pw1" placeholder="Новый пароль (минимум 8 символов)" autocomplete="new-password"
                    class="input-field w-full px-4 py-3 rounded-xl text-sm">
                <input type="password" id="pw2" placeholder="Повторите пароль" autocomplete="new-password"
                    class="input-field w-full px-4 py-3 rounded-xl text-sm">
                <div id="err" class="hidden text-xs text-red-600 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2"></div>
                <button id="save" class="vibe-btn w-full" type="button">Сохранить пароль</button>
            </div>
            <div id="state-done" class="hidden text-sm text-center">
                <p class="mb-4">Пароль изменён. Теперь можно войти.</p>
                <a href="/login" class="vibe-btn w-full" style="display:block;text-align:center">Войти</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.NrAuth.createClient(window.supabase, 'https://fiukyfyhotctvfdidktx.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpdWt5Znlob3RjdHZmZGlka3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDE5NzcsImV4cCI6MjA5Nzg3Nzk3N30.vX31uMBCEj-wjjR6qmFkwWammg70Av2h6I4YUnewL9Q');
        const $ = (id) => document.getElementById(id);
        const show = (id) => { ['state-wait', 'state-bad', 'state-form', 'state-done'].forEach((s) => $(s).classList.toggle('hidden', s !== id)); };
        let ready = false;

        // Ссылка из письма даёт временную сессию восстановления (событие PASSWORD_RECOVERY).
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session && !ready && /type=recovery|code=/.test(location.hash + location.search))) {
                ready = true; show('state-form');
            }
        });
        setTimeout(async () => {
            if (ready) return;
            const { data } = await supabase.auth.getSession();
            if (data && data.session && /type=recovery|code=/.test(location.hash + location.search)) { ready = true; show('state-form'); } else show('state-bad');
        }, 2500);

        function fail(msg) { const e = $('err'); e.textContent = msg; e.classList.remove('hidden'); }
        $('save').addEventListener('click', async () => {
            const a = $('pw1').value, b = $('pw2').value;
            $('err').classList.add('hidden');
            if (a.length < 8 || !/[0-9]/.test(a) || !/[A-Za-zА-Яа-яЁё]/.test(a)) return fail('Пароль: минимум 8 символов, буквы и цифры.');
            if (a !== b) return fail('Пароли не совпадают.');
            const btn = $('save'); btn.disabled = true;
            const { error } = await supabase.auth.updateUser({ password: a });
            btn.disabled = false;
            if (error) return fail(/same|different/i.test(error.message) ? 'Новый пароль должен отличаться от старого.' : error.message);
            try { await supabase.auth.signOut({ scope: 'local' }); } catch (_) { /* уже вышли */ }
            show('state-done');
        });
    </script>
</body>
</html>
